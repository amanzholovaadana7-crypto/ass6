<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sss.css">
    <script src="script.js" defer ></script>
</head>
<body>
    <div>
    <h2> Task 6 </h2>
    <p  id ="count" style="font-size: 30px;  margin-left:120px;"> 0 </p>
    <button id="decrease"> Decrease</button>
    <button id="reset"> Reset </button>
    <button id="increase"> Increase  </button>
</div>

<div> 
    <h2> Task 7 </h2>
    <label for="textInput" >Enter your text:</label> 
    <input type="text" id="textInput">
    <p id="preview">Your text will appear here</p>
    <p>Characters: <span id="charCount">0</span></p>
    <button id="clearText">Clear</button>
</div>
<div> 
    <h2> Task 8 </h2>
    <label for="chipmunkSelect">Choose a chipmunk:</label> 
    <select id="chipmunkSelect">
    <option value="alvin">Alvin</option>
    <option value="simon">Simon</option>
    <option value="teodor">Teodor</option> </select>
    <br><br>
    <img id="chipmunkImage"
     src="images/alvin.jpg"
     alt="Alvin"
     width="250">
     <p id="imageCaption">This is Alvin.</p>
</div>
<div>
    <h2> Task 9</h2>
    <label for="keyboardInput">Enter your text:</label> 
    <input type="text" id="keyboardInput">
    <p id="keyStatus">Press any key</p>
    <p id="keyResult"></p>
</div>
<div>
    <h2>Task 10: Mouse and Focus Events</h2>
    <p id="instruction">
    Hover over or focus on the card.</p>
    <div id="myCard" tabindex="0"> My Interactive Card</div>

</div>

</body>
</html>
